[workspace]
members = [
    "lib",
    "program",
    "script",
]
resolver = "2"
exclude = ["mdl"]


[workspace.dependencies]
alloy-sol-types = "0.8.7"
alloy-core = "0.8.7"
ecdsa = { version = "0.16.8" }
sp1-sdk = { version = "2.0.0" }


[patch.crates-io]

sha2-v0-10-8 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", branch = "patch-sha2-v0.10.8" }
